[package]
name = "sutra-ffi"
version = "0.1.0"
edition = "2021"
description = "C-ABI FFI bindings for Sutra Attention Engine (Windows WinUI 3 & Apple platforms)"
license = "MIT"

[lib]
name = "sutra_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sutra-core = { path = "../sutra-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
chrono = "0.4"
uuid = { version = "1.26", features = ["v4"] }
