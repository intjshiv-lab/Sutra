[package]
name = "sutra-desktop"
version = "1.2.0"
edition = "2024"
authors = ["Ramesh Choudhary"]
description = "Sovereign OS-Agnostic Desktop Attention Hub for Sutra"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
sutra-core = { path = "../sutra-core" }
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
