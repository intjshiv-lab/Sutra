[package]
name = "sutra-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sutra"
path = "src/main.rs"

[dependencies]
sutra-core = { path = "../sutra-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
